name: 🐛 Bug Report
description: Report an issue with an existing skill, instruction, or installer script
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details about the bug you encountered.
  - type: input
    id: affected_skill
    attributes:
      label: Affected Skill or File
      placeholder: e.g. 01-Productivity-and-Planning/ponytail or install.ps1
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should the skill or script have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What went wrong or hallucinated?
    validations:
      required: true
